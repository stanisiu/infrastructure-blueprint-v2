# .azure-pipelines/app-deployment.yml

trigger:
  branches:
    include:
    - main
  paths:
    include:
    - manifests/*  # 매니페스트 폴더에 변경이 있을 때만 실행

# Microsoft 공용 에이전트가 아닌, VNet에 주입된 내부 에이전트 풀 사용
pool:
  name: 'Private-AKS-Pool' 

variables:
  azureServiceConnection: 'sc-enterprise-prod'
  resourceGroup: 'rg-enterprise-vpn-sec'
  clusterName: 'aks-secure-prod'
  # [추가] 최소 권한 원칙을 강제하기 위한 대상 네임스페이스 명시
  targetNamespace: 'workload-app'

stages:
- stage: DeployToPrivateAKS
  displayName: '프라이빗 AKS 매니페스트 배포'
  jobs:
  - job: Deploy
    displayName: 'Secure kubectl apply'
    steps:
    # =====================================================
    # [수정됨] 인증과 배포를 단일 태스크로 통합하여 Token 유실 방지
    # =====================================================
    - task: AzureCLI@2
      displayName: 'AKS 인증 및 Phase 1 매니페스트 배포'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e # 오류 발생 시 즉시 실행 중단
          
          echo "1. 프라이빗 AKS 자격 증명(kubeconfig) 획득 (Cluster User 권한)"
          # 관리자(Admin) 권한이 아닌 일반 사용자 컨텍스트로 획득
          az aks get-credentials --resource-group $(resourceGroup) --name $(clusterName) --overwrite-existing
          
          echo "2. kubelogin을 통한 Entra ID(Azure AD) 토큰 변환"
          # Azure CLI의 현재 로그인 세션을 사용하여 K8s 인증 토큰 발급
          kubelogin convert-kubeconfig -l azurecli
          
          echo "3. 매니페스트 배포 (대상 네임스페이스: $(targetNamespace))"
          # -n 옵션을 명시하여 다른 네임스페이스로의 오발송(Spill-over) 원천 차단
          kubectl apply -f manifests/phase1-backend-db.yaml -n $(targetNamespace)
          
          echo "4. 배포 상태 확인"
          kubectl get pods -n $(targetNamespace)